name: expediente

services:
  app:
    build: .
    image: tfm-app:0.1.0
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      PORT: "8080"
      MONGO_URL: mongodb://mongo:27017/tfm
      S3_ENDPOINT: http://s3:9000
      S3_REGION: us-east-1
      S3_BUCKET: tfm-assets
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}
      S3_FORCE_PATH_STYLE: "true"
      LLM_PROVIDER: ${LLM_PROVIDER:-ollama}
      LLM_BASE_URL: ${LLM_BASE_URL:-http://ollama:11434}
      LLM_MODEL: ${LLM_MODEL:-gemma4:e2b}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_TIMEOUT_MS: ${LLM_TIMEOUT_MS:-90000}
    # Deliberately NOT depending on ollama / ollama-init: the model pull must never block the app.
    depends_on:
      mongo:
        condition: service_healthy
      s3:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    restart: unless-stopped

  mongo:
    image: mongo:8.0.32
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  s3:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin}
    ports:
      # Console with default credentials: loopback only.
      - "127.0.0.1:9001:9001"
    volumes:
      - s3-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  s3-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      s3:
        condition: service_healthy
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://s3:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" && mc mb --ignore-existing local/tfm-assets
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-minioadmin}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-minioadmin}

  ollama:
    image: ollama/ollama:0.40.3
    volumes:
      - ollama-data:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:0.40.3
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    environment:
      OLLAMA_HOST: ollama:11434
      LLM_MODEL: ${LLM_MODEL:-gemma4:e2b}
    entrypoint:
      - /bin/sh
      - -c
      - ollama pull "$${LLM_MODEL}"

volumes:
  mongo-data: {}
  s3-data: {}
  ollama-data: {}
