services:
  workspace:
    image: mcr.microsoft.com/devcontainers/typescript-node:22-bookworm
    command: sleep infinity
    volumes:
      - ../..:/workspaces:cached
      - claude-config:/home/node/.claude
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on: [mongo, s3, ollama]

  mongo:
    image: mongo:8
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  s3:
    image: pgsty/minio:latest
    command: server /data --console-address ":9001"
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - s3-data:/data

  s3-init:
    image: pgsty/mc:latest
    depends_on: [s3]
    restart: "no"
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://s3:9000 minioadmin minioadmin; do sleep 1; done;
      mc mb --ignore-existing local/tfm-assets;
      "

  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama

  ollama-init:
    image: ollama/ollama:latest
    depends_on: [ollama]
    restart: "no"
    environment:
      OLLAMA_HOST: ollama:11434
    entrypoint: ["/bin/sh", "-c", "until ollama list >/dev/null 2>&1; do sleep 1; done; ollama pull gemma4:e2b"]

volumes:
  claude-config:
  mongo-data:
  s3-data:
  ollama-data:
